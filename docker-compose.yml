version: "3.9"

services:
  # 1. PostgreSQL Persistent Database
  postgres:
    image: postgres:16-alpine
    container_name: tvr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verdict_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verdict_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-the_verdict_room}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verdict_user} -d ${POSTGRES_DB:-the_verdict_room}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & BullMQ Queue Store
  redis:
    image: redis:7-alpine
    container_name: tvr-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Next.js Web Studio & API Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tvr-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-verdict_user}:${POSTGRES_PASSWORD:-verdict_secret_2026}@postgres:5432/${POSTGRES_DB:-the_verdict_room}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-verdict_room_super_secure_jwt_secret_change_in_production_2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      INSTAGRAM_ACCOUNT_ID: ${INSTAGRAM_ACCOUNT_ID:-}
      TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      APP_URL: ${APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Dedicated Background Publishing & Scheduler Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tvr-worker
    restart: unless-stopped
    command: npm run worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-verdict_user}:${POSTGRES_PASSWORD:-verdict_secret_2026}@postgres:5432/${POSTGRES_DB:-the_verdict_room}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-verdict_room_super_secure_jwt_secret_change_in_production_2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      INSTAGRAM_ACCOUNT_ID: ${INSTAGRAM_ACCOUNT_ID:-}
      TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      APP_URL: ${APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
